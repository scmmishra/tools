version: 1.0.0
kind: captain_toolset
name: Shopify Support Tools
category: Commerce
description: Look up Shopify orders and customers for support conversations.

inputs:
  shop_domain:
    label: Shopify store domain
    type: string
    placeholder: example.myshopify.com
    required: true
  api_version:
    label: Shopify Admin API version
    type: string
    placeholder: 2026-07
    required: true

secrets:
  admin_api_access_token:
    label: Admin API access token
    type: password
    required: true

tools:
  - id: get_shopify_order
    title: Get Shopify Order
    description: Retrieve a Shopify order by its numeric resource ID with its payment, fulfillment, customer, total, and line-item details.
    http_method: GET
    endpoint_url: https://${{ inputs.shop_domain }}/admin/api/${{ inputs.api_version }}/orders/{{ order_id }}.json
    auth_type: api_key
    auth_config:
      name: X-Shopify-Access-Token
      key: ${{ secrets.admin_api_access_token }}
    param_schema:
      - name: order_id
        type: integer
        description: The numeric Shopify order resource ID, excluding the gid://shopify/Order/ prefix.
        required: true
    enabled: true

  - id: get_shopify_customer
    title: Get Shopify Customer
    description: Retrieve a Shopify customer by numeric ID with contact information, order count, and lifetime spend.
    http_method: GET
    endpoint_url: https://${{ inputs.shop_domain }}/admin/api/${{ inputs.api_version }}/customers/{{ customer_id }}.json
    auth_type: api_key
    auth_config:
      name: X-Shopify-Access-Token
      key: ${{ secrets.admin_api_access_token }}
    param_schema:
      - name: customer_id
        type: integer
        description: The numeric Shopify customer ID, excluding the gid://shopify/Customer/ prefix.
        required: true
    enabled: true
